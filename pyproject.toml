[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ai_assistant"
version = "1.0.0"
description = "Global AI assistant chat bubble for Frappe Desk; general Q&A plus data questions via ai_insights."
authors = [{ name = "RySS / Common Ground Initiative", email = "data@ryss.example.org" }]
readme = "README.md"
license = { file = "license.txt" }
requires-python = ">=3.10"

[tool.flit.module]
name = "ai_assistant"
